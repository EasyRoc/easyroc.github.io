      if (local) {
        var pc = document.getElementById("preconnect-gh-raw");
        if (pc && pc.parentNode) pc.parentNode.removeChild(pc);
      }
      var m = document.querySelector('meta[name="easyroc-asset-cdn"]');
      var base = (m && m.getAttribute("content")) || "";
      base = typeof base === "string" ? base.trim() : "";
      var first = "png/sky.webp";
      var href = local || !base ? first : (base.slice(-1) === "/" ? base : base + "/") + first;
      var l = document.createElement("link");
      l.rel = "preload";
      l.as = "image";
      l.href = href;
      if ("fetchPriority" in l) l.fetchPriority = "high";
      document.head.appendChild(l);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --radius-pill: 999px;
      --radius-dock: 16px;
      --radius-icon: 10px;
    }

    /* 深色 = 沉浸式（壁纸 + 浅色字），浅色 = 高对比玻璃 + 深色字 */
    [data-theme="dark"] {
      --hero-text: rgba(255, 255, 255, 0.99);
      --hero-muted: rgba(255, 255, 255, 0.76);
      --hero-faint: rgba(255, 255, 255, 0.48);
      --glass-bg: rgba(255, 255, 255, 0.11);
      --glass-bg-dock: rgba(255, 255, 255, 0.14);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-inner: rgba(255, 255, 255, 0.14);
      --shadow-text: 0 2px 24px rgba(0, 0, 0, 0.55);
      --input-placeholder: rgba(255, 255, 255, 0.42);
      --glass-tint: rgba(8, 10, 18, 0.52);
    }

    [data-theme="light"] {
      --hero-text: #1c1917;
      --hero-muted: #57534e;
      --hero-faint: #78716c;
      --glass-bg: rgba(255, 255, 255, 0.55);
      --glass-bg-dock: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(28, 25, 23, 0.1);
      --glass-inner: rgba(255, 255, 255, 0.75);
      --shadow-text: 0 1px 3px rgba(255, 255, 255, 0.8);
      --input-placeholder: #a8a29e;
      --glass-tint: rgba(252, 250, 248, 0.88);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
      color: var(--hero-text);
      background: #0a0e18;
      -webkit-font-smoothing: antialiased;
      transition: color 0.3s ease;
    }

    [data-theme="light"] body {
      background: #dfe6f0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .bg-stack {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* 底层：不依赖照片的设计感渐变（海岸线暮色氛围） */
    .bg-atmosphere {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 120% 80% at 70% 10%, rgba(255, 180, 120, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse 90% 60% at 20% 90%, rgba(30, 58, 95, 0.85) 0%, transparent 50%),
        linear-gradient(165deg, #0d1525 0%, #1a2744 35%, #2d1f3a 70%, #1a1020 100%);
      transition: opacity 0.8s ease;
    }

    [data-theme="light"] .bg-atmosphere {
      background:
        radial-gradient(ellipse 100% 70% at 60% 0%, rgba(255, 220, 190, 0.5) 0%, transparent 50%),
        radial-gradient(ellipse 80% 50% at 0% 100%, rgba(120, 150, 200, 0.35) 0%, transparent 45%),
        linear-gradient(175deg, #e8ecf5 0%, #d4dce8 45%, #c9d4e5 100%);
    }

    /* 照片仅作环境光层：降强度 + 混合，避免「壁纸网站」廉价感 */
    .bg-stack.no-photo .bg-pane {
      opacity: 0 !important;
      visibility: hidden;
    }

    /* 照片层：尽量还原清晰度，少叠混合与压暗（可读性交给轻量 vignette） */
    .bg-pane {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.1s ease;
      transform: scale(1.02);
      filter: saturate(1.06) brightness(1) contrast(1.03);
      mix-blend-mode: normal;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg-pane {
        transition: opacity 0.01ms;
        transform: none;
      }
    }

    .bg-pane.is-visible {
      opacity: 0.88;
    }

    [data-theme="light"] .bg-pane.is-visible {
      opacity: 0.78;
      mix-blend-mode: normal;
      filter: saturate(1.02) brightness(1.02) contrast(1.02);
    }

    /* 轻量压角，避免再盖一层「糊墙」 */
    .bg-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(ellipse 92% 72% at 50% 42%, transparent 0%, rgba(5, 8, 16, 0.28) 100%),
        linear-gradient(to top, rgba(5, 9, 18, 0.45) 0%, rgba(5, 9, 18, 0.08) 45%, transparent 68%);
      pointer-events: none;
    }

    [data-theme="light"] .bg-scrim {
      background:
        radial-gradient(ellipse 95% 75% at 50% 45%, rgba(255, 255, 255, 0.08) 0%, rgba(245, 248, 252, 0.38) 100%),
        linear-gradient(to top, rgba(255, 255, 255, 0.28) 0%, transparent 58%);
    }

    .bg-grain {
      position: absolute;
      inset: 0;
      z-index: 3;
      opacity: 0.028;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    [data-theme="light"] .bg-grain {
      opacity: 0.02;
    }

    .glass-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.45s ease;
      background: var(--glass-tint);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      backdrop-filter: blur(28px) saturate(1.4);
    }

    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      .glass-overlay {
        opacity: 0;
      }
    }

    body.glass-active .glass-overlay {
      opacity: 1;
    }

    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: clamp(16px, 3vw, 28px) clamp(16px, 4vw, 36px) clamp(20px, 3vh, 32px);
    }

    /* —— 顶栏 —— */
    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 24px;
      flex-shrink: 0;
    }

    .top-bar-right {
      position: relative;
      display: flex;
      align-items: center;
      margin-left: auto;
    }

    .hamburger-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3.5px;
      width: 32px;
      height: 32px;
      padding: 0;
      background: transparent;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .hamburger-btn:hover {
      background: var(--glass-inner);
    }

    .hamburger-bar {
      display: block;
      width: 15px;
      height: 1.5px;
      background: var(--hero-text);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
      transform-origin: center;
    }

    .hamburger-btn[aria-expanded="true"] .hamburger-bar:nth-child(1) {
      transform: translateY(5px) rotate(45deg);
    }

    .hamburger-btn[aria-expanded="true"] .hamburger-bar:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .hamburger-btn[aria-expanded="true"] .hamburger-bar:nth-child(3) {
      transform: translateY(-5px) rotate(-45deg);
    }

    .hamburger-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      min-width: 140px;
      padding: 6px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      backdrop-filter: blur(20px) saturate(1.8);
      box-shadow: 0 12px 36px rgba(0,0,0,0.22);
      opacity: 0;
      transform: translateY(-6px) scale(0.96);
      transition: opacity 0.22s ease, transform 0.22s ease;
      pointer-events: none;
    }

    [data-theme="light"] .hamburger-menu {
      box-shadow: 0 12px 36px rgba(30,40,60,0.12);
    }

    .hamburger-menu.is-open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .hamburger-item {
      display: block;
      padding: 9px 15px;
      font-size: 13px;
      font-weight: 600;
      color: var(--hero-text);
      border-radius: 10px;
      text-shadow: var(--shadow-text);
      transition: background 0.2s;
      white-space: nowrap;
    }

    .hamburger-item:hover {
      background: var(--glass-inner);
    }

    @media (max-width: 480px) {
      .hamburger-btn {
        width: 30px;
        height: 30px;
        gap: 3px;
        border-radius: 7px;
      }
      .hamburger-bar {
        width: 13px;
      }
      .hamburger-btn[aria-expanded="true"] .hamburger-bar:nth-child(1) {
        transform: translateY(4.5px) rotate(45deg);
      }
      .hamburger-btn[aria-expanded="true"] .hamburger-bar:nth-child(3) {
        transform: translateY(-4.5px) rotate(-45deg);
      }
    }


    /* —— 中间主区：搜索框靠上（与顶栏留出间距），为底部 Dock / 底栏留出空间 —— */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(100px, 86vh, 144px) 0 clamp(20px, 4vh, 40px);
      text-align: center;
    }

    .tagline {
      margin: 0 0 28px;
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--hero-text);
      text-shadow: var(--shadow-text);
      max-width: 22ch;
    }

    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(18px) saturate(1.65);
      backdrop-filter: blur(18px) saturate(1.65);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.035) inset,
        0 20px 50px rgba(0, 0, 0, 0.15);
    }

    [data-theme="light"] .glass-panel {
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.28) inset,
        0 12px 40px rgba(30, 40, 60, 0.08);
    }

    .omnibar-wrap {
      position: relative;
      width: min(100%, 560px);
      margin-left: auto;
      margin-right: auto;
    }

    .omnibar {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      width: 100%;
      padding: 4px 10px 4px 8px;
      border-radius: var(--radius-pill);
    }

    .ico-search-btn {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      padding: 6px 11px;
      min-width: 4.5em;
      border: none;
      background: transparent;
      color: var(--hero-muted);
      cursor: pointer;
      border-radius: 12px;
      transition: color 0.2s ease;
    }

    .ico-search-btn:hover {
      background: transparent;
      color: var(--hero-text);
    }

    [data-theme="light"] .ico-search-btn:hover {
      background: transparent;
      color: var(--hero-text);
    }

    .ico-search-btn .engine-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--hero-text);
      line-height: 1.15;
      pointer-events: none;
    }

    .omnibar .omni-input {
      flex: 1;
      min-width: 0;
      padding: 9px 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
      color: var(--hero-text);
      background: transparent;
      border: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .omnibar .omni-input::-webkit-search-decoration,
    .omnibar .omni-input::-webkit-search-cancel-button,
    .omnibar .omni-input::-webkit-search-results-button,
    .omnibar .omni-input::-webkit-search-results-decoration {
      display: none;
    }

    .omnibar .omni-input::-ms-clear {
      display: none;
    }

    .omnibar .omni-input::placeholder {
      color: var(--input-placeholder);
    }

    /* 站点条：置于底栏上方；由脚本在搜索有内容时设置 [hidden] 隐藏 */
    .dock-band {
      display: flex;
      justify-content: center;
      width: 100%;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .dock-band[hidden] {
      display: none !important;
    }

    .dock-wrap {
      margin-top: 0;
      width: fit-content;
      max-width: 100%;
      margin-left: auto;
      margin-right: auto;
      padding: 5px 7px;
      border-radius: var(--radius-dock);
      background: var(--glass-bg-dock);
      border: 1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(24px) saturate(1.7);
      backdrop-filter: blur(24px) saturate(1.7);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.03) inset,
        0 16px 44px rgba(0, 0, 0, 0.16);
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .dock-wrap::-webkit-scrollbar {
      height: 5px;
    }

    .dock-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 999px;
    }

    .dock-grid {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 4px;
      width: max-content;
      max-width: none;
      margin-inline: auto;
      padding: 0 0 1px;
    }

    .dock-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      flex: 0 0 auto;
      width: 56px;
      padding: 2px 1px;
      border-radius: var(--radius-icon);
      color: var(--hero-text);
      transition: background 0.2s, transform 0.15s;
    }

    .dock-item:hover {
      background: var(--glass-inner);
      transform: translateY(-1px) scale(1.02);
    }

    /* 与 portal2 一致：图标直接 img，固定尺寸 + 圆角，避免额外容器缩放发糊 */
    .dock-item > img {
      width: 36px;
      height: 36px;
      border-radius: 9px;
      display: block;
      flex-shrink: 0;
    }

    .dock-item .label {
      font-size: 10px;
      font-weight: 600;
      color: var(--hero-muted);
      text-align: center;
      line-height: 1.2;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* —— 底栏 —— */
    .bottom-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 16px;
      flex-shrink: 0;
      padding-top: 16px;
    }

    /* 天气隐藏：仍用三列网格，引言占中间列、时钟占右列，引言相对视口水平居中 */
    .bottom-bar:has(#weather[hidden]) {
      grid-template-columns: 1fr auto 1fr;
    }

    .bottom-bar:has(#weather[hidden]) .quote-block {
      grid-column: 2;
      justify-self: center;
    }

    .bottom-bar:has(#weather[hidden]) .clock-block {
      grid-column: 3;
      justify-self: end;
    }

    @media (max-width: 720px) {
      .bottom-bar {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .bottom-bar .weather {
        order: 1;
        text-align: center;
      }

      .bottom-bar .quote-block {
        order: 2;
        text-align: center;
      }

      .bottom-bar .clock-block {
        order: 3;
        justify-self: center;
        text-align: center;
      }

      .bottom-bar:has(#weather[hidden]) {
        grid-template-columns: 1fr;
      }

      .bottom-bar:has(#weather[hidden]) .quote-block,
      .bottom-bar:has(#weather[hidden]) .clock-block {
        grid-column: auto;
        justify-self: center;
      }

      .bottom-bar:has(#weather[hidden]) .clock-block {
        text-align: center;
      }
    }

    .weather {
      font-size: 13px;
      color: var(--hero-muted);
      text-shadow: var(--shadow-text);
    }

    .weather strong {
      display: block;
      font-size: 22px;
      font-weight: 600;
      color: var(--hero-text);
      letter-spacing: -0.02em;
    }

    .quote-block {
      margin: 0;
      max-width: 42ch;
      justify-self: center;
      text-align: center;
    }

    .quote-block p {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      font-style: italic;
      color: var(--hero-muted);
      line-height: 1.5;
      text-shadow: var(--shadow-text);
    }

    .quote-block cite {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-style: normal;
      color: var(--hero-faint);
    }

    .clock-block {
      justify-self: end;
      text-align: right;
      text-shadow: var(--shadow-text);
    }

    .clock-24 {
      font-size: clamp(1.45rem, 3.8vw, 1.95rem);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
      color: var(--hero-text);
      line-height: 1.15;
    }

    .clock-weekday {
      font-size: 12px;
      font-weight: 500;
      color: var(--hero-muted);
      margin-top: 6px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="bg-stack" id="bg-stack" aria-hidden="true">
    <div class="bg-atmosphere"></div>
    <div class="bg-pane" id="bg-pane-a"></div>
    <div class="bg-pane" id="bg-pane-b"></div>
    <div class="bg-scrim"></div>
    <div class="bg-grain" aria-hidden="true"></div>
  </div>
  <div class="glass-overlay" id="glass-overlay" aria-hidden="true"></div>

  <div class="page">
    <header class="top-bar">
      <div class="top-bar-right">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="菜单" aria-expanded="false">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </button>
        <div class="hamburger-menu" id="hamburger-menu">
          <a class="hamburger-item" href="blog.html">博客</a>
          <a class="hamburger-item" href="mindful-rest.html">正念休息</a>
        </div>
      </div>
    </header>

    <main class="hero" id="hero">

      <div class="omnibar-wrap">
        <form class="omnibar glass-panel" id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer">
          <button type="button" class="ico-search-btn" id="engine-cycle" title="当前：Google，点击切换搜索引擎" aria-label="切换搜索引擎，当前为 Google">
            <span class="engine-label" id="engine-label">Google</span>
          </button>
          <input
            type="text"
            id="q"
            name="q"
            class="omni-input"
            role="searchbox"
            aria-label="搜索或输入网址"
            placeholder="此刻，你想了解什么？"
            autocomplete="off"
            enterkeyhint="search"
            inputmode="search"
          />
        </form>
      </div>
    </main>

    <div class="dock-band" id="dock-band">
      <div class="dock-wrap" id="dock">
        <nav class="dock-grid" aria-label="网站快捷方式">
          <a class="dock-item" href="https://www.bilibili.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/bilibili.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">哔哩哔哩</span>
          </a>
          <a class="dock-item" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/youtube.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">YouTube</span>
          </a>
          <a class="dock-item" href="https://www.zhihu.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/zhihu.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">知乎</span>
          </a>
          <a class="dock-item" href="https://chat.openai.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/chatgpt.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">ChatGPT</span>
          </a>
          <a class="dock-item" href="https://chat.deepseek.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/deepseek.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">DeepSeek</span>
          </a>
          <a class="dock-item" href="https://outlook.live.com" target="_blank" rel="noopener noreferrer">
            <img src="icon/outlook.jpeg" alt="" width="36" height="36" loading="lazy" decoding="async" />
            <span class="label">Outlook</span>
          </a>
        </nav>
      </div>
    </div>

    <footer class="bottom-bar">
      <div class="weather" id="weather" hidden aria-hidden="true">
        <strong id="weather-temp">--°</strong>
        <span id="weather-desc">天气加载中…</span>
      </div>
      <blockquote class="quote-block">
        <p>The only true wisdom is in knowing you know nothing</p>
      </blockquote>
      <div class="clock-block" aria-live="polite">
        <div class="clock-24" id="clock-24">--:--</div>
        <div class="clock-weekday" id="clock-weekday">—</div>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      var THEME_KEY = "easyroc-portal-theme";
      var ROTATE_MS = 60 * 1000;
      /** 与 png/wallpapers.json 同步；fetch 失败（如 file://）时仍可用本地壁纸 */
      var PORTAL_WALLPAPERS = ["sky.webp", "sea.webp", "grassland.webp"];

      var assetCdnMeta = document.querySelector('meta[name="easyroc-asset-cdn"]');
      var ASSET_BASE = "";
      if (assetCdnMeta) {
        var _cdn = assetCdnMeta.getAttribute("content");
        if (_cdn) ASSET_BASE = _cdn.trim();
      }
      var _assetLoc = window.location;
      if (
        _assetLoc.protocol === "file:" ||
        /^localhost$/i.test(_assetLoc.hostname) ||
        _assetLoc.hostname === "127.0.0.1"
      ) {
        ASSET_BASE = "";
      }

      var html = document.documentElement;
      var body = document.body;
      var searchInput = document.getElementById("q");
      var glassOverlay = document.getElementById("glass-overlay");
      var paneA = document.getElementById("bg-pane-a");
      var paneB = document.getElementById("bg-pane-b");
      var bgStack = document.getElementById("bg-stack");
      var clock24El = document.getElementById("clock-24");
      var clockWeekdayEl = document.getElementById("clock-weekday");
      var dockBand = document.getElementById("dock-band");

      function updateDockForQuery() {
        if (!searchInput || !dockBand) return;
        var has = searchInput.value.trim().length > 0;
        dockBand.hidden = has;
        dockBand.setAttribute("aria-hidden", has ? "true" : "false");
      }

      function applyTheme(theme) {
        if (theme !== "light" && theme !== "dark") theme = "dark";
        html.setAttribute("data-theme", theme);
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
      }

      function initTheme() {
        var stored = null;
        try {
          stored = localStorage.getItem(THEME_KEY);
        } catch (e) {}
        if (stored === "light" || stored === "dark") {
          applyTheme(stored);
          return;
        }
        applyTheme("dark");
      }

      initTheme();

      function setGlass(on) {
        body.classList.toggle("glass-active", on);
        glassOverlay.setAttribute("aria-hidden", on ? "false" : "true");
      }

      if (searchInput) {
        searchInput.addEventListener("focus", function () {
          setGlass(true);
        });
        searchInput.addEventListener("blur", function () {
          setGlass(false);
        });

        searchInput.addEventListener("input", updateDockForQuery);
        searchInput.addEventListener("change", updateDockForQuery);
        updateDockForQuery();
      }

      function updateClock() {
        var d = new Date();
        clock24El.textContent = d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
        clockWeekdayEl.textContent = d.toLocaleDateString("zh-CN", { weekday: "long" });
      }

      updateClock();
      setInterval(updateClock, 1000);

      function toAbsoluteUrl(url) {
        try {
          return new URL(url, document.baseURI).href;
        } catch (e) {
          return url;
        }
      }

      /** 壁纸与 wallpapers.json 的地址；已 http(s) 开头则原样返回 */
      function resolveAsset(path) {
        if (!path) return path;
        if (/^https?:\/\//i.test(path)) return path;
        var base = ASSET_BASE;
        if (!base) return toAbsoluteUrl(path);
        if (base.slice(-1) !== "/") base += "/";
        try {
          return new URL(path.replace(/^\//, ""), base).href;
        } catch (e2) {
          return toAbsoluteUrl(path);
        }
      }

      function loadImageUrl(url) {
        return new Promise(function (resolve) {
          var abs = resolveAsset(url);
          var img = new Image();
          img.onload = function () {
            resolve(abs);
          };
          img.onerror = function () {
            resolve(null);
          };
          img.src = abs;
        });
      }

      /** 仅解析路径，不预下载整张图（避免 GitHub Pages 上多张巨图阻塞首屏） */
      function wallpaperPathsFromList(raw) {
        if (!raw || !raw.length) return [];
        var out = [];
        for (var i = 0; i < raw.length; i++) {
          var path = typeof raw[i] === "string" ? raw[i].trim() : "";
          if (!path) continue;
          if (path.indexOf("/") === -1) path = "png/" + path;
          out.push(path);
        }
        return out;
      }

      function normalizeList(raw) {
        if (!raw || !raw.length) return Promise.resolve([]);
        var tasks = raw.map(function (item) {
          var path = typeof item === "string" ? item.trim() : "";
          if (!path) return Promise.resolve(null);
          if (path.indexOf("/") === -1) path = "png/" + path;
          return loadImageUrl(path);
        });
        return Promise.all(tasks).then(function (results) {
          return results.filter(Boolean);
        });
      }

      function probeNumbered(max) {
        var urls = [];
        for (var i = 1; i <= max; i++) urls.push("png/" + i + ".png");
        return normalizeList(urls);
      }

      function fetchWallpapersManifest() {
        return fetch(resolveAsset("png/wallpapers.json")).then(function (r) {
          if (!r.ok) throw new Error("no json");
          return r.json();
        });
      }

      function initWallpapers() {
        return fetchWallpapersManifest()
          .catch(function () {
            if (ASSET_BASE) ASSET_BASE = "";
            return fetchWallpapersManifest();
          })
          .then(function (data) {
            if (!Array.isArray(data)) return [];
            return wallpaperPathsFromList(data);
          })
          .catch(function () {
            return [];
          })
          .then(function (paths) {
            if (paths.length) return paths;
            var fb = wallpaperPathsFromList(PORTAL_WALLPAPERS);
            if (fb.length) return fb;
            return probeNumbered(12);
          });
      }

      function setupRotator(urls) {
        if (!urls.length) {
          bgStack.classList.add("no-photo");
          return;
        }

        urls = urls.map(function (p) {
          return resolveAsset(p);
        });

        bgStack.classList.remove("no-photo");
        var frontEl = paneA;
        var backEl = paneB;
        var idx = 0;

        function showAt(i) {
          var u = urls[i % urls.length];
          var loader = new Image();
          loader.onload = function () {
            backEl.style.backgroundImage = 'url("' + u.replace(/"/g, '\\"') + '")';
            backEl.classList.add("is-visible");
            frontEl.classList.remove("is-visible");
            var tmp = frontEl;
            frontEl = backEl;
            backEl = tmp;
          };
          loader.onerror = function () {};
          loader.src = u;
        }

        frontEl.style.backgroundImage = 'url("' + urls[0].replace(/"/g, '\\"') + '")';
        frontEl.classList.add("is-visible");

        if (urls.length === 1) return;

        setInterval(function () {
          idx = (idx + 1) % urls.length;
          showAt(idx);
        }, ROTATE_MS);
      }

      initWallpapers().then(setupRotator);

      var form = document.getElementById("search-form");
      var q = document.getElementById("q");
      var engineCycleBtn = document.getElementById("engine-cycle");
      var engineLabelEl = document.getElementById("engine-label");

      var ENGINE_ORDER = ["google", "baidu", "bing"];
      var ENGINE_LABELS = { google: "谷歌", baidu: "百度", bing: "必应" };
      var engineIndex = 0;

      var endpoints = {
        google: { action: "https://www.google.com/search", param: "q" },
        baidu: { action: "https://www.baidu.com/s", param: "wd" },
        bing: { action: "https://www.bing.com/search", param: "q" },
      };

      function currentEngine() {
        return ENGINE_ORDER[engineIndex];
      }

      var ENGINE_STORAGE_KEY = "easyroc-portal-engine-v2";

      function syncForm() {
        if (!form || !q) return;
        var ep = endpoints[currentEngine()] || endpoints.google;
        form.setAttribute("action", ep.action);
        q.setAttribute("name", ep.param);
      }

      function updateEngineButton() {
        if (!engineCycleBtn) return;
        var label = ENGINE_LABELS[currentEngine()];
        engineCycleBtn.setAttribute("title", "当前：" + label + "，点击切换搜索引擎");
        engineCycleBtn.setAttribute("aria-label", "切换搜索引擎，当前为 " + label);
        if (engineLabelEl) engineLabelEl.textContent = label;
      }

      try {
        var saved = sessionStorage.getItem(ENGINE_STORAGE_KEY);
        if (saved != null) {
          var n = parseInt(saved, 10);
          if (n >= 0 && n < ENGINE_ORDER.length) engineIndex = n;
        }
      } catch (e) {}

      function cycleEngine() {
        engineIndex = (engineIndex + 1) % ENGINE_ORDER.length;
        try {
          sessionStorage.setItem(ENGINE_STORAGE_KEY, String(engineIndex));
        } catch (err) {}
        syncForm();
        updateEngineButton();
      }

      if (engineCycleBtn) {
        engineCycleBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          cycleEngine();
        });

        engineCycleBtn.addEventListener("keydown", function (e) {
          if (e.key === " " || e.key === "Enter") {
            e.preventDefault();
            cycleEngine();
          }
        });
      }

      syncForm();
      updateEngineButton();

      function looksLikeUrl(s) {
        s = s.trim();
        if (!s) return false;
        if (/^https?:\/\//i.test(s)) return true;
        if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s) && !/\s/.test(s)) return true;
        return false;
      }

      if (form && q) {
        form.addEventListener("submit", function (e) {
          var v = q.value.trim();
          if (!v) {
            e.preventDefault();
            return;
          }
          if (looksLikeUrl(v)) {
            e.preventDefault();
            var url = v;
            if (!/^https?:\/\//i.test(url)) url = "https://" + url;
            window.open(url, "_blank", "noopener,noreferrer");
          }
        });
      }

      /* —— 汉堡菜单 —— */
      var hamburgerBtn = document.getElementById("hamburger-btn");
      var hamburgerMenu = document.getElementById("hamburger-menu");

      if (hamburgerBtn && hamburgerMenu) {
        hamburgerBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          var expanded = hamburgerBtn.getAttribute("aria-expanded") === "true";
          hamburgerBtn.setAttribute("aria-expanded", String(!expanded));
          hamburgerMenu.classList.toggle("is-open", !expanded);
        });

        document.addEventListener("click", function (e) {
          if (!hamburgerMenu.contains(e.target) && !hamburgerBtn.contains(e.target)) {
            hamburgerBtn.setAttribute("aria-expanded", "false");
            hamburgerMenu.classList.remove("is-open");
          }
        });
      }
    })();
  </script>
</body>
</html>
